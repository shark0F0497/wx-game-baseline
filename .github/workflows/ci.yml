name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: 产物检查
        run: |
          test -s dist/game.js
          test -f dist/game.json
          node -e "const g=require('./dist/game.json'); if(!g.deviceOrientation) throw new Error('game.json 缺少 deviceOrientation')"
          du -h dist/game.js

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
